<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">Loading... - UNDERSOUTHERN</title>

  <!-- Open Graph & Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/undersouthern/my-images/main/logo-black.png">
  <meta property="og:type" content="music.song">
  <meta property="og:title" id="og-title" content="UNDERSOUTHERN Smart Link">
  <meta property="og:description" content="Distributed by UNDERSOUTHERN">
  <meta property="og:image" id="og-image" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: #121214;
      position: relative;
      overflow-x: hidden;
      padding: 30px 16px 40px;
    }

    /* Ambient dynamic blurred background */
    .bg-blur {
      position: fixed;
      top: -15%;
      left: -15%;
      width: 130%;
      height: 130%;
      background-size: cover;
      background-position: center;
      filter: blur(55px) brightness(0.42);
      z-index: 0;
      pointer-events: none;
      transform: scale(1.05);
      transition: background-image 0.4s ease-in-out;
    }

    .smartlink-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Main Card Frame */
    .card-wrapper {
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    /* Artwork Container */
    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #000;
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Track Info Bar với thanh phân cách uốn lượn nghệ thuật */
    .track-info-bar {
      background-color: #2b2b2b;
      color: #ffffff;
      text-align: center;
      padding: 20px 16px 30px;
      position: relative;
    }

    .track-info-bar::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 24px;
      background: #ffffff;
      clip-path: polygon(0 100%, 100% 40%, 100% 100%);
    }

    .track-title-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist-text {
      font-size: 0.88rem;
      font-weight: 500;
      color: #b5b5b5;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .distributed-text {
      font-size: 0.74rem;
      color: #888888;
      letter-spacing: 0.02em;
    }

    /* Platforms List */
    .platforms-list {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      padding-top: 5px;
    }

    .platform-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 22px;
      border-bottom: 1px solid #eef0f2;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .platform-row:last-child {
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      border-bottom: none;
    }

    .platform-row.coming-soon {
      cursor: default;
    }

    .platform-row.coming-soon:hover {
      background-color: #ffffff;
    }

    .platform-row:not(.coming-soon):hover {
      background-color: #f6f3fc;
      transform: scale(1.01);
    }

    .platform-brand-wrap {
      display: flex;
      align-items: center;
      height: 36px;
    }

    .platform-logo-img {
      max-height: 32px;
      max-width: 145px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .play-action-btn {
      padding: 9px 20px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-radius: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
      outline: none;
    }

    .platform-row:not(.coming-soon) .play-action-btn {
      background: #ffffff;
      color: #444444;
      border: 1px solid #dcdfe4;
      cursor: pointer;
    }

    .platform-row:not(.coming-soon):hover .play-action-btn {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
    }

    .platform-row.coming-soon .play-action-btn {
      color: #999999;
      background: #f4f6f8;
      border: 1px solid #e5e7eb;
      cursor: default;
    }

    /* Footer & Social Icons Styles */
    .page-footer {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .social-icons-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .social-icon-link {
      color: #888888;
      transition: color 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon-link:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .social-icon-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer-brand-link {
      color: #888888;
      text-decoration: none;
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      opacity: 0.85;
      transition: opacity 0.2s ease, color 0.2s ease;
    }

    .footer-brand-link:hover {
      opacity: 1;
      color: #ffffff;
    }

    .not-found {
      color: #fff;
      text-align: center;
      padding: 40px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- Background blur dynamic -->
  <div class="bg-blur" id="bg-ambient"></div>

  <div class="smartlink-container">
    <div class="card-wrapper" id="main-card">

      <!-- Cover Artwork Container -->
      <div class="cover-container">
        <img class="cover-img" id="track-cover" src="" alt="Cover Artwork">
      </div>

      <!-- Info Bar -->
      <div class="track-info-bar">
        <div class="track-title-text" id="track-title">Loading...</div>
        <div class="track-artist-text" id="track-artist"></div>
        <div class="distributed-text">Music Services</div>
      </div>

      <!-- Platforms List -->
      <div class="platforms-list" id="platforms-list">
        <!-- Render động theo dữ liệu D1 -->
      </div>
    </div>

    <!-- Footer with Social Icons & Powered by -->
    <footer class="page-footer">
      <div class="social-icons-bar">
        <!-- Website -->
        <a href="https://undersouthern.asia" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Website">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </a>
        <!-- Facebook -->
        <a href="https://www.facebook.com/undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Facebook">
          <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
        <!-- Instagram -->
        <a href="https://www.instagram.com/undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
        <!-- TikTok -->
        <a href="https://www.tiktok.com/@undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="TikTok">
          <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.63a6.33 6.33 0 0 0 10.86 4.47v-7.92a8.28 8.28 0 0 0 4.87 1.56v-3.44a4.85 4.85 0 0 1-1.14-.61z"/></svg>
        </a>
        <!-- YouTube -->
        <a href="https://www.youtube.com/@undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="YouTube">
          <svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
        </a>
        <!-- LinkedIn (Spotify link yêu cầu thay bằng LinkedIn chuẩn hệ thống) -->
        <a href="https://www.linkedin.com/company/undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
      </div>
      <a href="https://www.undersouthern.asia" target="_blank" rel="noopener" class="footer-brand-link">
        Powered by UNDERSOUTHERN
      </a>
    </footer>
  </div>

  <script>
    const PLATFORM_CONFIG = [
      { id: "url_spotify", name: "Spotify", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-spotify.png" },
      { id: "url_apple_music_music", name: "Apple Music", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-apple-music.png" },
      { id: "url_amazon_music", name: "Amazon Music", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-amazon-music.png" },
      { id: "url_soundcloud", name: "SoundCloud", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-soundcloud.png" },
      { id: "url_deezer", name: "Deezer", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-deezer.png" },
      { id: "url_youtube", name: "YouTube", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-youtube.png" },
      { id: "url_youtube_music", name: "YouTube Music", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-youtube-music.png" },
      { id: "url_zingmp3", name: "Zing MP3", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-zingmp3.png" },
      { id: "url_nct", name: "NhacCuaTui", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-nct.png" }
    ];

    async function loadReleaseData() {
      const pathSegments = window.location.pathname.split("/").filter(Boolean);
      const urlRelease = pathSegments[pathSegments.length - 1];

      if (!urlRelease || urlRelease === "index.html") {
        document.getElementById('main-card').innerHTML = '<div class="not-found">Không tìm thấy thông tin release yêu cầu.</div>';
        return;
      }

      try {
        const response = await fetch(`/api/release/${urlRelease}`);
        if (!response.ok) {
          throw new Error("Không tìm thấy dữ liệu bài hát");
        }
        
        const data = await response.json();

        // 1. Cập nhật tiêu đề trang
        const fullTitle = `${data.title} - UNDERSOUTHERN`;
        document.getElementById('page-title').textContent = fullTitle;
        document.getElementById('og-title').setAttribute('content', fullTitle);

        // 2. Tách tên bài hát và nghệ sĩ
        const parts = data.title.split("-").map(p => p.trim());
        const trackTitle = parts[0] || data.title;
        const trackArtist = parts.length > 1 ? parts.slice(1).join(" - ") : "";

        document.getElementById('track-title').textContent = trackTitle;
        const artistEl = document.getElementById('track-artist');
        if (trackArtist) {
          artistEl.textContent = trackArtist;
          artistEl.style.display = "block";
        } else {
          artistEl.style.display = "none";
        }

        // 3. Hiển thị ảnh bìa trực tiếp từ R2 Public Development URL
        if (data.cover_url && data.cover_url.trim() !== "") {
          document.getElementById('track-cover').src = data.cover_url;
          document.getElementById('bg-ambient').style.backgroundImage = `url(${data.cover_url})`;
          document.getElementById('og-image').setAttribute('content', data.cover_url);
        }

        // 4. Render danh sách nền tảng
        const listContainer = document.getElementById('platforms-list');
        listContainer.innerHTML = '';

        PLATFORM_CONFIG.forEach(platform => {
          const platformUrl = data[platform.id];
          const hasLink = platformUrl && platformUrl.trim() !== "";

          const row = document.createElement(hasLink ? 'a' : 'div');
          row.className = hasLink ? 'platform-row' : 'platform-row coming-soon';
          
          if (hasLink) {
            row.href = platformUrl; // Chuyển hướng trực tiếp ngay trên trang hiện tại
          }

          row.innerHTML = `
            <div class="platform-brand-wrap">
              <img src="${platform.logo}" alt="${platform.name}" class="platform-logo-img">
            </div>
            <button class="play-action-btn" type="button">${hasLink ? 'PLAY' : 'COMING SOON'}</button>
          `;
          listContainer.appendChild(row);
        });

      } catch (error) {
        console.error(error);
        document.getElementById('main-card').innerHTML = '<div class="not-found">Không tìm thấy trang hoặc bản release này không tồn tại.</div>';
      }
    }

    loadReleaseData();
  </script>
</body>
</html>
