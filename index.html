<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">Loading... - UNDERSOUTHERN</title>

  <!-- Open Graph & Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/undersouthern/my-images/main/logo-black.png">
  <meta property="og:type" content="music.song">
  <meta property="og:title" id="og-title" content="UNDERSOUTHERN Smart Link">
  <meta property="og:description" content="Distributed by UNDERSOUTHERN">
  <meta property="og:image" id="og-image" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: #121214;
      position: relative;
      overflow-x: hidden;
      padding: 30px 16px 40px;
    }

    /* Ambient dynamic blurred background */
    .bg-blur {
      position: fixed;
      top: -15%;
      left: -15%;
      width: 130%;
      height: 130%;
      background-size: cover;
      background-position: center;
      filter: blur(55px) brightness(0.42);
      z-index: 0;
      pointer-events: none;
      transform: scale(1.05);
      transition: background-image 0.4s ease-in-out;
    }

    .smartlink-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Main Card Frame */
    .card-wrapper {
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      padding-bottom: 35px;
    }

    /* Artwork Container */
    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #000;
      overflow: hidden;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Track Info Bar với thanh phân cách chéo xéo qua trái */
    .track-info-bar {
      background-color: #2b2b2b;
      color: #ffffff;
      text-align: center;
      padding: 20px 16px 38px;
      position: relative;
    }

    .track-info-bar::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28px;
      background: #ffffff;
      clip-path: polygon(0 100%, 100% 45%, 100% 100%);
    }

    .track-title-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist-text {
      font-size: 0.88rem;
      font-weight: 500;
      color: #b5b5b5;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .distributed-text {
      font-size: 0.74rem;
      color: #888888;
      letter-spacing: 0.02em;
    }

    /* Platforms List */
    .platforms-list {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      padding-top: 5px;
    }

    .platform-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 22px;
      border-bottom: 1px solid #eef0f2;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .platform-row.coming-soon {
      cursor: default;
    }

    .platform-row.coming-soon:hover {
      background-color: #ffffff;
    }

    .platform-row:not(.coming-soon):hover {
      background-color: #f6f3fc;
      transform: scale(1.01);
    }

    .platform-brand-wrap {
      display: flex;
      align-items: center;
      height: 36px;
    }

    .platform-logo-img {
      max-height: 32px;
      max-width: 145px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .play-action-btn {
      padding: 9px 20px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-radius: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
      outline: none;
    }

    .platform-row:not(.coming-soon) .play-action-btn {
      background: #ffffff;
      color: #444444;
      border: 1px solid #dcdfe4;
      cursor: pointer;
    }

    .platform-row:not(.coming-soon):hover .play-action-btn {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
    }

    .platform-row.coming-soon .play-action-btn {
      color: #999999;
      background: #f4f6f8;
      border: 1px solid #e5e7eb;
      cursor: default;
    }

    /* Footer & Social Icons Styles */
    .page-footer {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .social-icons-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .social-icon-link {
      color: #777777;
      transition: color 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-icon-link:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .social-icon-link svg {
      width: 11px;
      height: 11px;
      fill: currentColor;
    }

    .footer-brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .footer-powered-text {
      color: #777777;
      font-size: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      pointer-events: none; /* Cố định không cho bấm vào chữ Powered by */
    }

    .footer-brand-link {
      color: #777777;
      text-decoration: none;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      opacity: 0.85;
      transition: opacity 0.2s ease, color 0.2s ease;
    }

    .footer-brand-container:hover .footer-brand-link,
    .footer-brand-container:hover .footer-powered-text {
      opacity: 1;
      color: #ffffff;
    }

    .not-found {
      color: #fff;
      text-align: center;
      padding: 40px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- Background blur dynamic -->
  <div class="bg-blur" id="bg-ambient"></div>

  <div class="smartlink-container">
    <div class="card-wrapper" id="main-card">

      <!-- Cover Artwork Container -->
      <div class="cover-container">
        <img class="cover-img" id="track-cover" src="" alt="Cover Artwork">
      </div>

      <!-- Info Bar -->
      <div class="track-info-bar">
        <div class="track-title-text" id="track-title">Loading...</div>
        <div class="track-artist-text" id="track-artist"></div>
        <div class="distributed-text">Music Services</div>
      </div>

      <!-- Platforms List -->
      <div class="platforms-list" id="platforms-list">
        <!-- Render động theo dữ liệu D1 -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="page-footer">
      <div class="social-icons-bar">
        <!-- Facebook Logo -->
        <a href="https://www.facebook.com/undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Facebook">
          <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
        <!-- Instagram Logo -->
        <a href="https://www.instagram.com/undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Instagram">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </a>
        <!-- TikTok Logo -->
        <a href="https://www.tiktok.com/@undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="TikTok">
          <svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.5.18-1.92 1.12-3.72 2.5-4.96 1.66-1.51 3.98-2.25 6.2-2.01v4.11c-1.04-.15-2.12.11-2.92.79-.8.69-1.2 1.76-1.16 2.81.04 1.07.6 2.08 1.51 2.65.91.58 2.05.69 3.06.3 1.01-.39 1.76-1.3 1.93-2.35.12-.76.11-1.53.12-2.3V.02z"/></svg>
        </a>
        <!-- YouTube Logo -->
        <a href="https://www.youtube.com/@undersouthern" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="YouTube">
          <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
      </div>
      <div class="footer-brand-container">
        <span class="footer-powered-text">Powered by</span>
        <a href="https://www.undersouthern.asia" target="_blank" rel="noopener" class="footer-brand-link">UNDERSOUTHERN</a>
      </div>
    </footer>
  </div>

  <script>
    const PLATFORM_CONFIG = [
      { id: "url_spotify", name: "Spotify", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-spotify.png" },
      { id: "url_apple_music_music", name: "Apple Music", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-apple-music.png" },
      { id: "url_amazon_music", name: "Amazon Music", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-amazon-music.png" },
      { id: "url_soundcloud", name: "SoundCloud", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-soundcloud.png" },
      { id: "url_deezer", name: "Deezer", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-deezer.png" },
      { id: "url_youtube", name: "YouTube", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-youtube.png" },
      { id: "url_youtube_music", name: "YouTube Music", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-youtube-music.png" },
      { id: "url_zingmp3", name: "Zing MP3", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-zingmp3.png" },
      { id: "url_nct", name: "NhacCuaTui", logo: "https://raw.githubusercontent.com/undersouthern/listen/main/assets/logo-nct.png" }
    ];

    async function loadReleaseData() {
      const pathSegments = window.location.pathname.split("/").filter(Boolean);
      const urlRelease = pathSegments[pathSegments.length - 1];

      if (!urlRelease || urlRelease === "index.html") {
        document.getElementById('main-card').innerHTML = '<div class="not-found">Không tìm thấy thông tin release yêu cầu.</div>';
        return;
      }

      try {
        const response = await fetch(`/api/release/${urlRelease}`);
        if (!response.ok) {
          throw new Error("Không tìm thấy dữ liệu bài hát");
        }
        
        const data = await response.json();

        // 1. Cập nhật tiêu đề trang
        const fullTitle = `${data.title} - UNDERSOUTHERN`;
        document.getElementById('page-title').textContent = fullTitle;
        document.getElementById('og-title').setAttribute('content', fullTitle);

        // 2. Tách tên bài hát và nghệ sĩ
        const parts = data.title.split("-").map(p => p.trim());
        const trackTitle = parts[0] || data.title;
        const trackArtist = parts.length > 1 ? parts.slice(1).join(" - ") : "";

        document.getElementById('track-title').textContent = trackTitle;
        const artistEl = document.getElementById('track-artist');
        if (trackArtist) {
          artistEl.textContent = trackArtist;
          artistEl.style.display = "block";
        } else {
          artistEl.style.display = "none";
        }

        // 3. Hiển thị ảnh bìa trực tiếp từ R2 Public Development URL
        if (data.cover_url && data.cover_url.trim() !== "") {
          document.getElementById('track-cover').src = data.cover_url;
          document.getElementById('bg-ambient').style.backgroundImage = `url(${data.cover_url})`;
          document.getElementById('og-image').setAttribute('content', data.cover_url);
        }

        // 4. Render danh sách nền tảng
        const listContainer = document.getElementById('platforms-list');
        listContainer.innerHTML = '';

        PLATFORM_CONFIG.forEach(platform => {
          const platformUrl = data[platform.id];
          const hasLink = platformUrl && platformUrl.trim() !== "";

          const row = document.createElement(hasLink ? 'a' : 'div');
          row.className = hasLink ? 'platform-row' : 'platform-row coming-soon';
          
          if (hasLink) {
            row.href = platformUrl; // Chuyển hướng trực tiếp ngay trên trang hiện tại
          }

          row.innerHTML = `
            <div class="platform-brand-wrap">
              <img src="${platform.logo}" alt="${platform.name}" class="platform-logo-img">
            </div>
            <button class="play-action-btn" type="button">${hasLink ? 'PLAY' : 'COMING SOON'}</button>
          `;
          listContainer.appendChild(row);
        });

      } catch (error) {
        console.error(error);
        document.getElementById('main-card').innerHTML = '<div class="not-found">Không tìm thấy trang hoặc bản release này không tồn tại.</div>';
      }
    }

    loadReleaseData();
  </script>
</body>
</html>
