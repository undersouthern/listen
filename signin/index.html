<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign In | UNDERSOUTHERN</title>

  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/undersouthern/my-images/main/logo-black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background-color: #f4f6f8;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.85rem;
      color: #666;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: #fafbfc;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.9rem;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: #7c3aed;
      background: #fff;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #7c3aed;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s;
    }

    .login-btn:hover {
      background: #6d28d9;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>UNDERSOUTHERN</h1>
      <p>Sign in to administrative dashboard</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="login-email" required placeholder="label@undersouthern.asia">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-pass" required placeholder="••••••••">
      </div>

      <button type="submit" class="login-btn" id="submit-btn">Sign In</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-msg');
      
      submitBtn.textContent = 'Signing in...';
      submitBtn.disabled = true;
      errorMsg.style.display = 'none';

      const formData = new FormData();
      formData.append('email', document.getElementById('login-email').value);
      formData.append('pass', document.getElementById('login-pass').value);

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (response.ok && result.success) {
          window.location.href = '/dashboard';
        } else {
          errorMsg.textContent = result.error || 'Đăng nhập thất bại!';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        errorMsg.textContent = 'Lỗi kết nối hệ thống!';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.textContent = 'Sign In';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
